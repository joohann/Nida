preview_adhan:
  name: Preview Adhan
  description: Play an adhan sound as a preview on a speaker.
  fields:
    sound:
      name: Sound
      description: Which adhan do you want to play?
      required: true
      selector:
        select:
          options: []
          custom_value: true
    speaker:
      name: Speaker
      description: Which speaker do you want to use?
      required: true
      selector:
        entity:
          domain: media_player
    volume:
      name: Volume
      description: Volume (0–100%). Leave empty to use the configured volume.
      required: false
      default: 30
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

test_prayer:
  name: Test Prayer
  description: Test the adhan for a specific prayer.
  fields:
    prayer:
      name: Prayer
      description: Which prayer do you want to test?
      required: true
      default: dhuhr
      selector:
        select:
          options:
            - label: Fajr
              value: fajr
            - label: Dhuhr
              value: dhuhr
            - label: Asr
              value: asr
            - label: Maghrib
              value: maghrib
            - label: Isha
              value: isha

test_salawat:
  name: Test Salawat
  description: Test the Salawat recitation before Fajr.
  fields:
    sound:
      name: Sound
      description: Which Salawat do you want to play?
      required: false
      selector:
        select:
          options: []
          custom_value: true
    speaker:
      name: Speaker
      description: Which speaker do you want to use?
      required: false
      selector:
        entity:
          domain: media_player
    volume:
      name: Volume
      description: Volume (0–100%). Leave empty to use the configured volume.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
