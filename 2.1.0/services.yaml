play_adhan:
  name: Play adhan
  description: Play the configured adhan sound for a given prayer on one or more media players. Used internally by Nida's scheduler at each prayer time, but also callable manually for preview/testing.
  fields:
    prayer:
      name: Prayer
      description: Which prayer to play the adhan for. Fajr uses the fajr_adhan sound category; the other four use the standard adhan category.
      required: true
      example: fajr
      selector:
        select:
          options:
            - fajr
            - dhuhr
            - asr
            - maghrib
            - isha
    entity_id:
      name: Media player(s)
      description: One or more media_player entities to play on. If omitted, falls back to the players configured in the Nida panel (options.adhan_media_players).
      required: false
      example: media_player.living_room
      selector:
        entity:
          domain: media_player
          multiple: true
