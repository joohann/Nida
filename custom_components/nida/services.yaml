test_notification:
  description: Stuur een test notificatie naar geconfigureerde apparaten.
  fields:
    message:
      description: Tekst van de notificatie (optioneel).
      name: Bericht
      required: false
      selector:
        text: {}
    title:
      description: Titel van de notificatie (optioneel).
      name: Titel
      required: false
      selector:
        text: {}
  name: Test Notificatie
test_prayer:
  description: Test de adhan voor een specifiek gebed.
  fields:
    prayer:
      default: dhuhr
      description: Welk gebed wil je testen?
      name: Prayer
      required: true
      selector:
        select:
          options:
          - label: Fajr
            value: fajr
          - label: Dhuhr
            value: dhuhr
          - label: Asr
            value: asr
          - label: Maghrib
            value: maghrib
          - label: Isha
            value: isha
          - label: Jumat (vrijdag)
            value: jumat
  name: Test Prayer
test_reminder:
  description: Test een pre-adhan reminder (geluid + TTS).
  fields:
    prayer:
      default: Dhuhr
      description: Naam van het gebed (voor in de TTS tekst).
      name: Gebed
      required: false
      selector:
        text: {}
    reminder:
      default: reminder_1
      description: Welke reminder wil je testen?
      name: Reminder
      required: false
      selector:
        select:
          options:
          - label: Reminder 1
            value: reminder_1
          - label: Reminder 2
            value: reminder_2
  name: Test Reminder
test_suhoor:
  description: Test het suhoor alarm.
  fields:
    sound:
      description: Welk suhoor geluid wil je afspelen?
      name: Sound
      required: false
      selector:
        select:
          options:
          - label: Artiest
            value: Ramadan [suhoor] - Artiest.mp3
    speaker: &id007
      description: Welke speaker wil je gebruiken?
      name: Speaker
      required: false
      selector: *id001
    volume: *id002
  name: Test Suhoor
test_tarhim:
  description: Test de Tarhim recitatie voor Fajr.
  fields:
    sound:
      description: Welk tarhim wil je afspelen?
      name: Sound
      required: false
      selector:
        select:
          options:
          - *id003
          - *id004
          - *id005
          - *id006
    speaker: *id007
    volume: *id002
  name: Test Tarhim
