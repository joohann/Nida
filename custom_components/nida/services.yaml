play_adhan:
  name: Play adhan
  description: Play the configured adhan sound for a given prayer on one or more media players. Used internally by Nida's scheduler at each prayer time, but also callable manually for preview/testing.
  fields:
    prayer:
      name: Prayer
      description: Which prayer to play the adhan for. Fajr uses the fajr_adhan sound category; the other four use the standard adhan category.
      required: true
      example: fajr
      selector:
        select:
          options:
            - fajr
            - dhuhr
            - asr
            - maghrib
            - isha
    entity_id:
      name: Media player(s)
      description: One or more media_player entities to play on. If omitted, falls back to the players configured in the Nida panel (options.adhan_media_players).
      required: false
      example: media_player.living_room
      selector:
        entity:
          domain: media_player
          multiple: true

play_preview:
  name: Play preview
  description: >-
    Play any of Nida's configured sounds on the real speakers at its real
    configured volume, so you can hear how loud it will actually be. Night
    mode and open-contact adjustments are applied (a preview at 23:00 sounds
    like 23:00); the pre-adhan dip is not, and guest mode is bypassed since
    this is an explicit action. Duas are not listed here — use nida.play_dua,
    which already plays each dua on its own player at its own volume.
  fields:
    item:
      name: Sound
      description: Which configured sound to play. "adhan" uses the day-adhan category and "fajr_adhan" the Fajr one; with random adhan enabled, both play the file that would actually fire today.
      required: true
      example: adhan
      selector:
        select:
          options:
            - adhan
            - fajr_adhan
            - pre_adhan_jingle
            - test_nasheed
            - fajr_alarm
    entity_id:
      name: Media player(s)
      description: One or more media_player entities to play on. If omitted, falls back to the players configured in the Nida panel. Ignored for fajr_alarm, which always uses its own configured player.
      required: false
      example: media_player.living_room
      selector:
        entity:
          domain: media_player
          multiple: true
