preview_adhan:
  description: Speel een adhan geluid af als preview
  fields:
    sound:
      description: Welke adhan wil je afspelen?
      name: Geluid
      required: true
      selector:
        select:
          options:
          - label: 01 Adhan Fajr
            value: 01-adhan-fajr.mp3
          - label: 02 Adhan Fajr
            value: 02-adhan-fajr.mp3
          - label: 03 Adhan Fajr
            value: 03-adhan-fajr.mp3
    speaker:
      description: Op welke speaker wil je afspelen?
      name: Speaker
      required: true
      selector:
        entity:
          domain: media_player
    volume:
      default: 0.5
      description: Volume tussen 0.0 en 1.0
      name: Volume
      required: false
      selector:
        number:
          max: 1.0
          min: 0.0
          mode: slider
          step: 0.05
  name: Preview Adhan
test_prayer:
  description: Test de adhan voor een specifiek gebed
  fields:
    prayer:
      default: dhuhr
      description: Welk gebed wil je testen?
      name: Gebed
      required: true
      selector:
        select:
          options:
          - label: Fajr
            value: fajr
          - label: Dhuhr
            value: dhuhr
          - label: Asr
            value: asr
          - label: Maghrib
            value: maghrib
          - label: Isha
            value: isha
  name: Test Gebed
test_tarhim:
  description: Test de tarhim recitatie
  fields:
    sound:
      description: Welke tarhim wil je afspelen?
      name: Tarhim Geluid
      required: false
      selector:
        select:
          options:
          - label: 01 Tarhim
            value: 01-tarhim.mp3
          - label: 02 Tarhim
            value: 02-tarhim.mp3
    speaker:
      description: Op welke speaker wil je afspelen?
      name: Speaker
      required: false
      selector:
        entity:
          domain: media_player
    volume:
      default: 0.4
      description: Volume tussen 0.0 en 1.0
      name: Volume
      required: false
      selector:
        number:
          max: 1.0
          min: 0.0
          mode: slider
          step: 0.05
  name: Test Tarhim
