# Changelog:
#   2.5.7 (2026-11-27): Actions pinned to a commit SHA; softprops/
#     action-gh-release v1 -> v3.0.4 (Node 24, same inputs; the token
#     input defaults to the workflow token). Write access only for the
#     build job, checkout v7 without stored credentials.
#   2.5.6 (2026-11-27): Builds only on a pushed v* tag, no longer also on
#     release published/edited. Creating a release (gh release create or the
#     web UI) creates the tag, so that still builds, once. Two runs uploading
#     nida.zip at the same moment made one fail with "Not Found" (v2.5.5),
#     and every edit of the release notes rebuilt the zip. The concurrency
#     group makes a re-pushed tag wait for a running build instead of racing it.
#   2.3.14 (2026-09-09): Single-source release. nida.zip now contains only
#     custom_components/nida/ (sounds + frontend live inside it). Dropped the
#     old www/ sound and card bundling and the extension-pack assets, per the
#     single-source-of-truth rule.
name: Release Nida
on:
  push:
    tags:
      - "v*"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create nida.zip
        run: |
          cd custom_components/nida
          zip -r ../../nida.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".DS_Store"
          cd ../..
          echo "=== nida.zip contents ==="
          unzip -l nida.zip
          echo "=== nida.zip size ==="
          du -sh nida.zip

      - name: Upload to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: nida.zip
          fail_on_unmatched_files: false
