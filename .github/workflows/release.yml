# Changelog:
#   2.3.14 (2026-09-09): Single-source release. nida.zip now contains only
#     custom_components/nida/ (sounds + frontend live inside it). Dropped the
#     old www/ sound and card bundling and the extension-pack assets, per the
#     single-source-of-truth rule.
name: Release Nida
on:
  release:
    types: [published, edited]
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create nida.zip
        run: |
          cd custom_components/nida
          zip -r ../../nida.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".DS_Store"
          cd ../..
          echo "=== nida.zip contents ==="
          unzip -l nida.zip
          echo "=== nida.zip size ==="
          du -sh nida.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: nida.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
