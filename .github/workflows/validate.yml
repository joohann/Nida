# Changelog:
#   2.5.7 (2026-11-27): Read-only token, actions pinned to a commit SHA
#     (the HACS action runs the ghcr.io/hacs/action:main image, so the pin
#     does not freeze the validation), checkout v7 without stored
#     credentials.
name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration
