##############################################################################
# .github/workflows/build-android.yml
# @version    1.0.0
# @since      2026-03-28
#
# Builds a signed release APK for Nida v2.
#
# Triggers:
#   - Push of a version tag:  git tag v2.1.0 && git push origin v2.1.0
#   - Manual trigger via GitHub UI (workflow_dispatch)
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64   base64-encoded .jks keystore file
#   KEY_ALIAS         alias used when the keystore was created
#   KEY_PASSWORD      password for the private key
#   STORE_PASSWORD    password for the keystore itself
#
# Output:
#   - APK attached to the GitHub Release (on tag push)
#   - APK available as workflow artifact (always, for 30 days)
##############################################################################

name: Build signed release APK

on:
  push:
    tags:
      - "android-v*"           # triggers on v2.0.0, v2.1.0, etc.
  workflow_dispatch:   # allows manual run from the GitHub Actions tab

jobs:
  build:
    name: Build & sign APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Java 17 (required by Android Gradle Plugin 8.x) ───────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── 4. Install npm dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Build web assets (Vite → dist/) ───────────────────────────────
      - name: Build web assets
        run: npm run build

      # ── 6. Sync Capacitor (copies dist/ into android/) ───────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 7. Gradle cache (speeds up subsequent builds significantly) ───────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 8. Decode keystore from secret ────────────────────────────────────
      # The keystore is stored as a base64 string in GitHub secrets.
      # See SETUP_KEYSTORE.md for how to generate and encode it.
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/nida-release.jks

      # ── 9. Make gradlew executable ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build signed release APK ─────────────────────────────────────
      # Signing properties are passed as -P flags so they never touch disk.
      # The build.gradle reads them via project.findProperty().
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=nida-release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon

      # ── 11. Rename APK to include version ─────────────────────────────────
      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             artifacts/nida-${VERSION}.apk
          echo "APK_PATH=artifacts/nida-${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=nida-${VERSION}.apk"           >> $GITHUB_ENV

      # ── 12. Upload APK as workflow artifact (always available) ────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── 13. Create GitHub Release and attach APK (tag pushes only) ────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Nida ${{ github.ref_name }}"
          body: |
            ## Nida ${{ github.ref_name }}

            ### Installatie
            1. Download `${{ env.APK_NAME }}` hieronder.
            2. Zet op je Android-telefoon: **Instellingen → Beveiliging → Onbekende bronnen** aan.
            3. Open de APK op je telefoon en installeer.

            ### Wijzigingen
            Zie [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md) voor details.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      # ── 14. Cleanup keystore from runner (security) ───────────────────────
      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/nida-release.jks
